<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Drawing — Kamal Kids Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.kk-tab.active{color:#FF6B6B}
.kk-logo-icon{background:linear-gradient(135deg,#FF6B6B,#FFE66D);box-shadow:0 4px 14px rgba(255,107,107,0.4)}
.brand-bot{color:#FFE66D}
/* Drawing board layout */
.draw-page{display:flex;flex-direction:column;align-items:center;height:calc(100vh - 130px);overflow:hidden;background:#1a1a2e;padding:0}
/* Canvas wrapper */
.canvas-wrap{position:relative;flex-shrink:0;margin:10px auto 0;border-radius:18px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5);cursor:crosshair;touch-action:none}
#drawCanvas{display:block;background:#FFFFFF}
/* Tools bar */
.tools-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,0.06);border-radius:18px;margin:10px 14px 0;flex-wrap:wrap;justify-content:center;max-width:500px}
.tool-btn{width:44px;height:44px;border:2px solid transparent;border-radius:12px;background:rgba(255,255,255,0.08);color:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0}
.tool-btn:hover{background:rgba(255,255,255,0.16)}
.tool-btn.active{border-color:#FF6B6B;background:rgba(255,107,107,0.2)}
.tool-sep{width:1px;height:30px;background:rgba(255,255,255,0.12);flex-shrink:0}
/* Size slider */
.size-wrap{display:flex;align-items:center;gap:8px;padding:0 4px}
.size-label{font-size:0.75rem;color:rgba(255,255,255,0.5);white-space:nowrap;font-weight:700}
#sizeSlider{width:80px;height:4px;cursor:pointer;accent-color:#FF6B6B}
/* Color palette */
.palette-row{display:flex;gap:7px;padding:8px 14px;justify-content:center;flex-wrap:wrap;max-width:500px;margin:0}
.color-dot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s;flex-shrink:0}
.color-dot.active{border-color:#fff;transform:scale(1.25)}
.color-dot:hover{transform:scale(1.15)}
/* Action buttons */
.action-row{display:flex;gap:10px;padding:8px 14px;justify-content:center;max-width:500px;width:100%;margin:0}
.action-btn{flex:1;padding:11px 8px;border:none;border-radius:14px;font-size:0.95rem;font-weight:800;cursor:pointer;font-family:'Baloo 2',sans-serif;transition:all 0.15s;box-shadow:0 4px 14px rgba(0,0,0,0.25)}
.action-btn:active{transform:scale(0.96)}
.btn-clear{background:rgba(244,67,54,0.8);color:#fff}
.btn-save{background:linear-gradient(135deg,#4CAF50,#2E7D32);color:#fff}
.btn-undo{background:rgba(255,255,255,0.12);color:#fff}
/* Current tool indicator */
.tool-indicator{font-size:0.75rem;color:rgba(255,255,255,0.45);text-align:center;padding:0 0 4px;font-weight:700}
</style>
</head>
<body>

<header class="kk-header">
  <a href="index.html" class="kk-logo">
    <div class="kk-logo-icon">🎨</div>
    <div class="kk-logo-text">
      <div class="brand-top">Drawing</div>
      <div class="brand-bot">KIDS ART BOARD 🖌️</div>
    </div>
  </a>
  <div class="kk-stats">
    <div class="kk-stat">⭐ <span id="hdr-stars">0</span></div>
    <div class="kk-stat">💎 <span id="hdr-d">0</span></div>
  </div>
</header>

<div class="draw-page" id="drawPage">

  <!-- Tool buttons -->
  <div class="tools-bar">
    <button class="tool-btn active" id="btn-pen"   onclick="setTool('pen')"   title="Pen">✏️</button>
    <button class="tool-btn"        id="btn-fill"  onclick="setTool('fill')"  title="Fill">🪣</button>
    <button class="tool-btn"        id="btn-erase" onclick="setTool('erase')" title="Eraser">🔲</button>
    <div class="tool-sep"></div>
    <div class="size-wrap">
      <span class="size-label">Size</span>
      <input type="range" id="sizeSlider" min="2" max="40" value="6" oninput="updateSize(this.value)">
      <span class="size-label" id="sizeVal">6</span>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="drawCanvas"></canvas>
  </div>

  <!-- Tool indicator -->
  <div class="tool-indicator" id="toolInd">✏️ Pen — draw freely!</div>

  <!-- Color palette -->
  <div class="palette-row" id="palette"></div>

  <!-- Action buttons -->
  <div class="action-row">
    <button class="action-btn btn-undo" onclick="undo()">↩️ Undo</button>
    <button class="action-btn btn-clear" onclick="clearCanvas()">🗑️ Clear</button>
    <button class="action-btn btn-save" onclick="saveDrawing()">💾 Save</button>
  </div>

</div>

<nav class="kk-bnav">
  <a href="index.html"><span class="nb-icon">🏠</span>Home</a>
  <a href="awards.html"><span class="nb-icon">🏆</span>Awards</a>
  <a href="profile.html"><span class="nb-icon">👤</span>Profile</a>
</nav>

<script src="js/app.js"></script>
<script>
// ─── Canvas Setup ───
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');

const COLORS = [
  '#000000','#FFFFFF','#F44336','#E91E63','#9C27B0','#3F51B5',
  '#2196F3','#00BCD4','#4CAF50','#8BC34A','#FFEB3B','#FF9800',
  '#FF5722','#795548','#607D8B','#FFB3BA'
];

let currentColor = '#000000';
let currentTool = 'pen';
let penSize = 6;
let isDrawing = false;
let lastX = 0, lastY = 0;
let history = [];
const MAX_HISTORY = 20;

function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  const page = document.getElementById('drawPage');
  const pageH = page.offsetHeight;
  const toolsH = document.querySelector('.tools-bar').offsetHeight + 10;
  const paletteH = document.querySelector('.palette-row').offsetHeight + 8;
  const actionsH = document.querySelector('.action-row').offsetHeight + 8;
  const indH = document.querySelector('.tool-indicator').offsetHeight + 4;
  const headerH = 12;
  const maxH = pageH - toolsH - paletteH - actionsH - indH - headerH - 30;
  const maxW = Math.min(window.innerWidth - 28, 500);
  const size = Math.min(maxW, maxH);
  const w = Math.round(size);
  const h = Math.round(size * 0.78);
  // Save current drawing
  const img = ctx.getImageData ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
  canvas.width = w;
  canvas.height = h;
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
  fillWhite();
  if (img && img.width > 0) { try { ctx.putImageData(img, 0, 0); } catch(e){} }
}

function fillWhite() {
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ─── Color Palette ───
function buildPalette() {
  const row = document.getElementById('palette');
  COLORS.forEach((c, i) => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (i === 0 ? ' active' : '');
    dot.style.background = c;
    if (c === '#FFFFFF') dot.style.boxShadow = 'inset 0 0 0 1px #ccc';
    dot.onclick = () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      dot.classList.add('active');
      currentColor = c;
      if (currentTool === 'erase') setTool('pen');
    };
    row.appendChild(dot);
  });
}

// ─── Tools ───
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + tool).classList.add('active');
  const ind = document.getElementById('toolInd');
  if (tool === 'pen')   { ind.textContent = '✏️ Pen — draw freely!'; canvas.style.cursor = 'crosshair'; }
  if (tool === 'fill')  { ind.textContent = '🪣 Fill — tap area to fill with color!'; canvas.style.cursor = 'cell'; }
  if (tool === 'erase') { ind.textContent = '🔲 Eraser — erase any area!'; canvas.style.cursor = 'cell'; }
}

function updateSize(v) {
  penSize = parseInt(v);
  document.getElementById('sizeVal').textContent = v;
}

// ─── Drawing ───
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function saveState() {
  history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (history.length > MAX_HISTORY) history.shift();
}

function startDraw(e) {
  e.preventDefault();
  if (currentTool === 'fill') {
    saveState();
    const pos = getPos(e);
    floodFill(Math.round(pos.x), Math.round(pos.y), currentColor);
    if (typeof Rewards !== 'undefined') Rewards.addStars(1);
    return;
  }
  isDrawing = true;
  saveState();
  const pos = getPos(e);
  lastX = pos.x; lastY = pos.y;
  ctx.beginPath();
  ctx.arc(lastX, lastY, (currentTool === 'erase' ? penSize * 2 : penSize) / 2, 0, Math.PI * 2);
  ctx.fillStyle = currentTool === 'erase' ? '#FFFFFF' : currentColor;
  ctx.fill();
}

function draw(e) {
  e.preventDefault();
  if (!isDrawing) return;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(pos.x, pos.y);
  ctx.strokeStyle = currentTool === 'erase' ? '#FFFFFF' : currentColor;
  ctx.lineWidth = currentTool === 'erase' ? penSize * 2 : penSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  lastX = pos.x; lastY = pos.y;
}

function endDraw(e) {
  if (isDrawing) {
    isDrawing = false;
    if (typeof Rewards !== 'undefined') Rewards.addStars(1);
  }
}

// ─── Flood Fill ───
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b,255];
}

function colorsMatch(a, b, tolerance) {
  return Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]) <= tolerance;
}

function floodFill(sx, sy, fillHex) {
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const fillColor = hexToRgb(fillHex);
  const idx = (sy * w + sx) * 4;
  const targetColor = [data[idx], data[idx+1], data[idx+2], data[idx+3]];
  if (colorsMatch(targetColor, fillColor, 5)) return;
  const stack = [[sx, sy]];
  const visited = new Uint8Array(w * h);
  while (stack.length) {
    const [x, y] = stack.pop();
    if (x < 0 || x >= w || y < 0 || y >= h) continue;
    const i = y * w + x;
    if (visited[i]) continue;
    const pi = i * 4;
    if (!colorsMatch([data[pi],data[pi+1],data[pi+2],data[pi+3]], targetColor, 30)) continue;
    visited[i] = 1;
    data[pi] = fillColor[0]; data[pi+1] = fillColor[1];
    data[pi+2] = fillColor[2]; data[pi+3] = 255;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

// ─── Actions ───
function undo() {
  if (history.length === 0) return;
  ctx.putImageData(history.pop(), 0, 0);
}

function clearCanvas() {
  if (confirm('Clear the drawing?')) {
    saveState();
    fillWhite();
  }
}

function saveDrawing() {
  const link = document.createElement('a');
  link.download = 'my-drawing-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  if (typeof Rewards !== 'undefined') { Rewards.addStars(10); Rewards.addDiamonds(1); }
  alert('🎨 Drawing saved! +10 stars +1 diamond!');
}

// ─── Event Listeners ───
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', draw, {passive:false});
canvas.addEventListener('touchend', endDraw, {passive:false});

// ─── Init ───
buildPalette();
resizeCanvas();
setTool('pen');
window.addEventListener('resize', () => { resizeCanvas(); });

function updHdr() {
  if (typeof Rewards === 'undefined') return;
  const r = Rewards.get();
  document.getElementById('hdr-stars').textContent = r.stars || 0;
  document.getElementById('hdr-d').textContent = r.diamonds || 0;
}
setInterval(updHdr, 2000); updHdr();
</script>
</body>
</html>
