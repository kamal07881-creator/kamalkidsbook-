let activeRhymeBtn = null;

function toggleRhyme(btn, text, lang) {
  if (activeRhymeBtn && activeRhymeBtn !== btn) {
    activeRhymeBtn.textContent = '🔊 सुनें / Listen';
    activeRhymeBtn.classList.remove('playing');
    Speech.stop();
  }
  if (Speech.isSpeaking() && activeRhymeBtn === btn) {
    Speech.stop(); btn.textContent = '🔊 सुनें / Listen'; btn.classList.remove('playing'); activeRhymeBtn = null;
  } else {
    activeRhymeBtn = btn; btn.textContent = '⏸ Stop'; btn.classList.add('playing');
    Speech.speak(text, lang, 0.88, () => { btn.textContent = '🔊 सुनें / Listen'; btn.classList.remove('playing'); if(activeRhymeBtn===btn) activeRhymeBtn=null; });
    Rewards.addStars(2);
  }
}

function buildRhymes(list, wrapperId) {
  const el = document.getElementById(wrapperId);
  if (el.children.length) return;
  list.forEach(r => {
    const card = document.createElement('div');
    card.className = 'rhyme-card';
    card.style.background = r.bg;
    card.innerHTML = `
      <img src="${r.img}" alt="${r.title}" onerror="this.style.height='3px'" style="width:100%;height:180px;object-fit:cover;display:block">
      <div class="rhyme-body">
        <div class="rhyme-title">${r.title}</div>
        <div class="rhyme-text">${r.text.replace(/\n/g,'<br>')}</div>
        <button class="rhyme-btn" style="background:linear-gradient(135deg,${r.ac},${r.ac}99)"
          onclick="toggleRhyme(this,\`${r.text.replace(/`/g,'\\`')}\`,'${r.lang}')">
          🔊 सुनें / Listen
        </button>
      </div>`;
    el.appendChild(card);
  });
}
