let hiIdx=0, hiPlaying=false;

function hiRender(dir){
  const d=HI_ALPHA[hiIdx];
  const card=document.getElementById('hi-card');
  card.querySelector('img').src=d.img;
  card.querySelector('img').alt=d.word;
  document.getElementById('hi-letter').textContent=d.letter;
  document.getElementById('hi-letter').style.color=d.color;
  document.getElementById('hi-word').textContent=d.word;
  document.getElementById('hi-hindi').textContent=d.hindi;
  document.getElementById('hi-phrase').textContent=d.phrase;
  document.getElementById('hi-counter').textContent=(hiIdx+1)+' / '+HI_ALPHA.length;
  const cls=dir>0?'slide-r':'slide-l';
  card.classList.remove('slide-r','slide-l'); void card.offsetWidth; card.classList.add(cls);
  setTimeout(()=>card.classList.remove(cls),300);
  Speech.stop(); hiPlaying=false;
  const pb=document.getElementById('hi-play');
  pb.textContent='▶'; pb.classList.remove('playing');
}
function hiNext(){hiIdx=(hiIdx+1)%HI_ALPHA.length;hiRender(1);Rewards.addStars(1);}
function hiPrev(){hiIdx=(hiIdx-1+HI_ALPHA.length)%HI_ALPHA.length;hiRender(-1);Rewards.addStars(1);}
function hiPlayFn(){
  const d=HI_ALPHA[hiIdx];
  const pb=document.getElementById('hi-play');
  if(hiPlaying){Speech.stop();hiPlaying=false;pb.textContent='▶';pb.classList.remove('playing');}
  else{hiPlaying=true;pb.textContent='⏸';pb.classList.add('playing');
    Speech.speak(d.phrase,'hi-IN',0.9,()=>{hiPlaying=false;pb.textContent='▶';pb.classList.remove('playing');});
    Rewards.addStars(1);}
}

function buildHiGrid(){
  const el=document.getElementById('hi-grid');
  if(el.children.length) return;
  HI_ALPHA.forEach(a=>{
    const item=document.createElement('div');item.className='grid-item';
    item.innerHTML=`<img src="${a.img}" alt="${a.word}" onerror="this.style.display='none'"><div class="grid-item-label" style="color:${a.color};font-family:'Hind',sans-serif">${a.letter} - ${a.word}</div>`;
    item.onclick=()=>{Speech.speak(a.phrase,'hi-IN',0.9);Rewards.addStars(1);};
    el.appendChild(item);
  });
}

let hiStoriesBuilt=false;
function buildHiStories(){
  if(hiStoriesBuilt) return; hiStoriesBuilt=true;
  const el=document.getElementById('hi-stories-wrap');
  let activeBtn=null;
  HI_STORIES.forEach(s=>{
    const card=document.createElement('div');card.className='s-card';card.style.background=s.bg;
    const tid='ht_'+Math.random().toString(36).slice(2,8);
    card.innerHTML=`
      <img src="${s.img}" alt="${s.title}" onerror="this.style.height='3px'">
      <div class="s-body">
        <div class="s-badge" style="font-family:'Hind',sans-serif">📖 हिंदी कहानी</div>
        <div class="s-title" style="font-family:'Hind',sans-serif">${s.title}</div>
        <div class="s-text" id="${tid}" style="font-family:'Hind',sans-serif"></div>
        <button class="s-btn" style="background:linear-gradient(135deg,${s.ac},${s.ac}99);font-family:'Hind',sans-serif"
          data-text="${s.text.replace(/"/g,'&quot;')}" onclick="toggleHiStory(this)">🔊 सुनें</button>
      </div>`;
    el.appendChild(card);
    buildWords(s.text,'hi-IN',document.getElementById(tid));
  });
}

let hiActiveBtn=null;
function toggleHiStory(btn){
  const text=btn.dataset.text;
  if(hiActiveBtn&&hiActiveBtn!==btn){hiActiveBtn.textContent='🔊 सुनें';hiActiveBtn.classList.remove('playing');Speech.stop();}
  if(Speech.isSpeaking()&&hiActiveBtn===btn){Speech.stop();btn.textContent='🔊 सुनें';btn.classList.remove('playing');hiActiveBtn=null;}
  else{hiActiveBtn=btn;btn.textContent='⏸ रोकें';btn.classList.add('playing');
    Speech.speak(text,'hi-IN',0.9,()=>{btn.textContent='🔊 सुनें';btn.classList.remove('playing');if(hiActiveBtn===btn)hiActiveBtn=null;});
    Rewards.addStars(3);}
}

let curAbhyasPlaying = -1;

function buildAbhyas(){
  const el = document.getElementById('abhyas-wrap');
  if(el.children.length) return;
  HINDI_ABHYAS_ITEMS.forEach((item, idx) => {
    const card = document.createElement('div');
    card.id = 'abhyas_card_' + idx;
    card.style.cssText = `
      background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;
      box-shadow:0 8px 24px rgba(0,0,0,0.07);border:2px solid ${item.color}33;
      transition:transform 0.2s, background 0.2s;
    `;
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div>
          <span style="background:${item.color}18;color:${item.color};font-weight:900;padding:4px 12px;border-radius:12px;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px">${item.title}</span>
          <div style="font-size:1.15rem;font-weight:900;color:#1e293b;margin-top:6px;font-family:'Hind',sans-serif">${item.sub}</div>
        </div>
        <button id="abhyas_btn_${idx}" style="
          width:48px;height:48px;border-radius:50%;background:${item.color};color:#fff;
          font-size:1.3rem;display:flex;align-items:center;justify-content:center;
          box-shadow:0 4px 12px ${item.color}66;cursor:pointer;border:none;flex-shrink:0
        ">▶</button>
      </div>
      <div style="
        background:#F8FAFC;border-radius:16px;padding:16px;font-size:1.35rem;font-weight:800;
        color:#0f172a;line-height:2;white-space:pre-line;text-align:center;font-family:'Hind',sans-serif;
        letter-spacing:2px;border:1px solid #E2E8F0
      ">${item.content}</div>
    `;

    const playFn = () => {
      const btn = document.getElementById('abhyas_btn_' + idx);
      if(curAbhyasPlaying === idx){
        Speech.stop();
        curAbhyasPlaying = -1;
        btn.textContent = '▶';
        card.style.background = '#fff';
      } else {
        if(curAbhyasPlaying >= 0){
          const prevBtn = document.getElementById('abhyas_btn_' + curAbhyasPlaying);
          const prevCard = document.getElementById('abhyas_card_' + curAbhyasPlaying);
          if(prevBtn) prevBtn.textContent = '▶';
          if(prevCard) prevCard.style.background = '#fff';
        }
        Speech.stop();
        curAbhyasPlaying = idx;
        btn.textContent = '⏹';
        card.style.background = item.color + '10';
        Speech.speak(item.speechText, 'hi-IN', 0.85, () => {
          btn.textContent = '▶';
          card.style.background = '#fff';
          if(curAbhyasPlaying === idx) curAbhyasPlaying = -1;
        });
        if(typeof Rewards !== 'undefined') Rewards.addStars(1);
      }
    };

    card.onclick = playFn;
    card.querySelector('#abhyas_btn_' + idx).onclick = (e) => { e.stopPropagation(); playFn(); };
    el.appendChild(card);
  });
}

hiRender(1);
const hiCard=document.getElementById('hi-card');
let hsx=0;
hiCard.addEventListener('touchstart',e=>{hsx=e.touches[0].clientX;},{passive:true});
hiCard.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-hsx;if(Math.abs(dx)>40){if(dx<0)hiNext();else hiPrev();}},{passive:true});
document.addEventListener('keydown',e=>{
  if(document.getElementById('pane-akshar').classList.contains('active')){
    if(e.key==='ArrowRight') hiNext();
    if(e.key==='ArrowLeft') hiPrev();
  }
});
