// Build Grid
function buildGrid() {
  const el = document.getElementById('en-grid');
  if (el.children.length) return;
  EN_ALPHA.forEach(a => {
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.innerHTML = `<img src="${a.img}" alt="${a.word}" onerror="this.style.display='none'"><div class="grid-item-label" style="color:${a.color}">${a.letter} - ${a.word}</div>`;
    item.onclick = () => { Speech.speak(a.phrase, 'en-US', 0.9); Rewards.addStars(1); };
    el.appendChild(item);
  });
}

// Build Stories
let storiesBuilt = false;
function buildStories() {
  if (storiesBuilt) return; storiesBuilt = true;
  const el = document.getElementById('en-stories-wrap');
  let activeBtn = null;
  EN_STORIES.forEach(s => {
    const card = document.createElement('div');
    card.className = 's-card';
    card.style.background = s.bg;
    const tid = 'et_' + s.title.replace(/\W/g,'_').slice(0,16);
    card.innerHTML = `
      <img src="${s.img}" alt="${s.title}" onerror="this.style.height='3px'">
      <div class="s-body">
        <div class="s-badge">📖 English Story</div>
        <div class="s-title">${s.title}</div>
        <div class="s-text" id="${tid}"></div>
        <button class="s-btn" style="background:linear-gradient(135deg,${s.ac},${s.ac}99)" onclick="toggleStory(this,'${s.title.replace(/'/g,"\\'")}')">🔊 Listen Story</button>
      </div>`;
    el.appendChild(card);
    buildWords(s.text, 'en-US', document.getElementById(tid));
  });
  window._enStories = EN_STORIES;
  window._enActiveBtn = null;
}

function toggleStory(btn, title) {
  const s = (window._enStories||EN_STORIES).find(x => x.title === title);
  if (!s) return;
  if (window._enActiveBtn && window._enActiveBtn !== btn) {
    window._enActiveBtn.textContent = '🔊 Listen Story';
    window._enActiveBtn.classList.remove('playing');
    Speech.stop();
  }
  if (Speech.isSpeaking() && window._enActiveBtn === btn) {
    Speech.stop(); btn.textContent = '🔊 Listen Story'; btn.classList.remove('playing'); window._enActiveBtn = null;
  } else {
    window._enActiveBtn = btn; btn.textContent = '⏸ Stop'; btn.classList.add('playing');
    Speech.speak(s.text, 'en-US', 0.9, () => { btn.textContent = '🔊 Listen Story'; btn.classList.remove('playing'); if(window._enActiveBtn===btn) window._enActiveBtn=null; });
    Rewards.addStars(3);
  }
}

let curEnPracticePlaying = -1;

function buildEnPractice(){
  const el = document.getElementById('en-practice-wrap');
  if(el.children.length) return;
  EN_PRACTICE_ITEMS.forEach((item, idx) => {
    const card = document.createElement('div');
    card.id = 'en_practice_card_' + idx;
    card.style.cssText = `
      background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;
      box-shadow:0 8px 24px rgba(0,0,0,0.07);border:2px solid ${item.color}33;
      transition:transform 0.2s, background 0.2s;
    `;
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div>
          <span style="background:${item.color}18;color:${item.color};font-weight:900;padding:4px 12px;border-radius:12px;font-size:0.8rem;letter-spacing:0.5px">${item.title}</span>
          <div style="font-size:1.15rem;font-weight:900;color:#1e293b;margin-top:6px">${item.sub}</div>
        </div>
        <button id="en_practice_btn_${idx}" style="
          width:48px;height:48px;border-radius:50%;background:${item.color};color:#fff;
          font-size:1.3rem;display:flex;align-items:center;justify-content:center;
          box-shadow:0 4px 12px ${item.color}66;cursor:pointer;border:none;flex-shrink:0
        ">▶</button>
      </div>
      <div style="
        background:#F8FAFC;border-radius:16px;padding:16px;font-size:1.4rem;font-weight:900;
        color:#0f172a;line-height:2.1;white-space:pre-line;text-align:center;
        letter-spacing:3px;border:1px solid #E2E8F0
      ">${item.content}</div>
    `;

    const playFn = () => {
      const btn = document.getElementById('en_practice_btn_' + idx);
      if(curEnPracticePlaying === idx){
        Speech.stop();
        curEnPracticePlaying = -1;
        btn.textContent = '▶';
        card.style.background = '#fff';
      } else {
        if(curEnPracticePlaying >= 0){
          const prevBtn = document.getElementById('en_practice_btn_' + curEnPracticePlaying);
          const prevCard = document.getElementById('en_practice_card_' + curEnPracticePlaying);
          if(prevBtn) prevBtn.textContent = '▶';
          if(prevCard) prevCard.style.background = '#fff';
        }
        Speech.stop();
        curEnPracticePlaying = idx;
        btn.textContent = '⏹';
        card.style.background = item.color + '10';
        Speech.speak(item.speechText, 'en-US', 0.88, () => {
          btn.textContent = '▶';
          card.style.background = '#fff';
          if(curEnPracticePlaying === idx) curEnPracticePlaying = -1;
        });
        if(typeof Rewards !== 'undefined') Rewards.addStars(1);
      }
    };

    card.onclick = playFn;
    card.querySelector('#en_practice_btn_' + idx).onclick = (e) => { e.stopPropagation(); playFn(); };
    el.appendChild(card);
  });
}

// Build grid when tab clicked
document.querySelectorAll('.kk-tab')[2].addEventListener('click', buildGrid);
