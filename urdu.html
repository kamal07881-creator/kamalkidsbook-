let urIdx=0,urPlaying=false;
function urRender(dir){
  const d=UR_ALPHA[urIdx];
  const card=document.getElementById('ur-card');
  card.querySelector('img').src=d.img;
  document.getElementById('ur-letter').textContent=d.letter;
  document.getElementById('ur-letter').style.color=d.color;
  document.getElementById('ur-word').textContent=d.word;
  document.getElementById('ur-hindi').textContent=d.hindi;
  document.getElementById('ur-phrase').textContent=d.phrase;
  document.getElementById('ur-counter').textContent=(urIdx+1)+' / '+UR_ALPHA.length;
  const cls=dir>0?'slide-r':'slide-l';
  card.classList.remove('slide-r','slide-l');void card.offsetWidth;card.classList.add(cls);
  setTimeout(()=>card.classList.remove(cls),300);
  Speech.stop();urPlaying=false;
  const pb=document.getElementById('ur-play');pb.textContent='▶';pb.classList.remove('playing');
}
function urNext(){urIdx=(urIdx+1)%UR_ALPHA.length;urRender(1);Rewards.addStars(1);}
function urPrev(){urIdx=(urIdx-1+UR_ALPHA.length)%UR_ALPHA.length;urRender(-1);Rewards.addStars(1);}
function urPlayFn(){
  const d=UR_ALPHA[urIdx];const pb=document.getElementById('ur-play');
  if(urPlaying){Speech.stop();urPlaying=false;pb.textContent='▶';pb.classList.remove('playing');}
  else{urPlaying=true;pb.textContent='⏸';pb.classList.add('playing');
    Speech.speak(d.phrase,'ur-PK',0.9,()=>{urPlaying=false;pb.textContent='▶';pb.classList.remove('playing');});
    Rewards.addStars(1);}
}
function buildUrduGrid(){
  const el=document.getElementById('ur-grid');if(el.children.length) return;
  UR_ALPHA.forEach(a=>{
    const item=document.createElement('div');item.className='grid-item';
    item.innerHTML=`<img src="${a.img}" alt="${a.word}" onerror="this.style.display='none'"><div class="grid-item-label" style="color:${a.color};font-family:'Noto Nastaliq Urdu',serif;font-size:0.9rem">${a.letter}</div>`;
    item.onclick=()=>{Speech.speak(a.phrase,'ur-PK',0.9);Rewards.addStars(1);};
    el.appendChild(item);
  });
}
let urStoriesBuilt=false;
function buildUrduStories(){
  if(urStoriesBuilt) return;urStoriesBuilt=true;
  const el=document.getElementById('ur-stories-wrap');
  let activeBtn=null;
  UR_STORIES.forEach(s=>{
    const card=document.createElement('div');card.className='s-card';card.style.background=s.bg;
    const tid='ut_'+Math.random().toString(36).slice(2,8);
    card.innerHTML=`
      <img src="${s.img}" alt="${s.title}" onerror="this.style.height='3px'">
      <div class="s-body" style="direction:rtl;text-align:right">
        <div class="s-badge">📖 اردو کہانی</div>
        <div class="s-title" style="font-family:'Noto Nastaliq Urdu',serif">${s.title}</div>
        <div class="s-text rtl" id="${tid}"></div>
        <button class="s-btn" style="background:linear-gradient(135deg,${s.ac},${s.ac}99);direction:ltr"
          data-text="${s.text.replace(/"/g,'&quot;')}" onclick="toggleUrStory(this)">🔊 سنیں</button>
      </div>`;
    el.appendChild(card);
    const textEl=document.getElementById(tid);
    textEl.textContent=s.text;
  });
}
let urActiveBtn=null;
function toggleUrStory(btn){
  const text=btn.dataset.text;
  if(urActiveBtn&&urActiveBtn!==btn){urActiveBtn.textContent='🔊 سنیں';urActiveBtn.classList.remove('playing');Speech.stop();}
  if(Speech.isSpeaking()&&urActiveBtn===btn){Speech.stop();btn.textContent='🔊 سنیں';btn.classList.remove('playing');urActiveBtn=null;}
  else{urActiveBtn=btn;btn.textContent='⏸ روکیں';btn.classList.add('playing');
    Speech.speak(text,'ur-PK',0.9,()=>{btn.textContent='🔊 سنیں';btn.classList.remove('playing');if(urActiveBtn===btn)urActiveBtn=null;});
    Rewards.addStars(3);}
}
urRender(1);
const urCard=document.getElementById('ur-card');
let usx=0;
urCard.addEventListener('touchstart',e=>{usx=e.touches[0].clientX;},{passive:true});
urCard.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-usx;if(Math.abs(dx)>40){if(dx<0)urNext();else urPrev();}},{passive:true});
</script>
